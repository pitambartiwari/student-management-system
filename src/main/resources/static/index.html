<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student-management-system</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1>Student Management System</h1>
    <p>Manage your students in one place.</p>

    <section class="form-section">
    <h2>Add Student</h2>

    <form id="studentForm">
        <label for="name">Student Name:</label>
        <input type="text" id="name" placeholder="Enter Student Name" required>

        <br><br>

        <label for="course">Course:</label>
        <input type="text" id="course" placeholder="Enter Course" required>

        <br><br>

        <label for="role">Role:</label>
        <input type="text" id="role" placeholder="Enter Role" required>

        <br><br>

        <button type="submit" id="submitButton">Add Student</button>
        <button type="button" id="cancelButton" style="display: none;">Cancel Edit</button>
    </form>
    </section>

    <section class="table-section">
    <h2>Student List</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="studentTable">
        </tbody>
    </table>
    </section>

</div>

<script src="script.js"></script>
</body>
</html>
